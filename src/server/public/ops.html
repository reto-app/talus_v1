<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talus Dispatch Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/shell.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/ops.css" />
</head>
<body>
  <a class="talus-skip-link" href="#main">Skip to main content</a>
  <div class="talus-shell">
    <div id="navSlot"></div>
    <div class="talus-content">
      <header class="talus-topbar">
        <h1 class="talus-condensed">DISPATCH BOARD</h1>
        <div class="talus-topbar-meta" id="topbarMeta"><span id="tenantLabel">Loading business…</span></div>
        <div class="talus-topbar-spacer"></div>
        <label class="talus-field" style="margin:0;display:flex;align-items:center;gap:8px;font-size:12px">
          <span class="talus-visually-hidden">Board date</span>
          <input type="date" id="dateInput" class="talus-input" style="margin-top:0;min-width:150px" />
        </label>
        <button type="button" class="talus-icon-btn" id="refreshButton" aria-label="Refresh board"></button>
        <button type="button" class="talus-icon-btn" id="logoutButton" aria-label="Sign out"></button>
      </header>

      <div id="connectionBanner" class="talus-banner" role="status" hidden></div>

      <div class="ops-filter-strip" role="group" aria-label="Filter dispatch queue" id="filterStrip"></div>

      <main id="main" class="ops-main">
        <section class="ops-queue is-active-view" id="queueSection" aria-label="Dispatch queue">
          <div class="ops-queue-head">
            <h2>Dispatch queue</h2>
            <span class="talus-badge talus-badge-neutral" id="queueCount">0</span>
          </div>
          <div class="ops-queue-list" id="queueList"></div>
        </section>

        <section class="ops-command" id="commandCenter" aria-label="Booking detail">
          <button type="button" class="talus-btn talus-btn-sm ops-back-to-queue" id="backToQueue">← Back to queue</button>
          <div id="emptyState" class="talus-empty">
            <p><strong>Select a reservation</strong></p>
            <p>Choose a pickup, return, or on-rent booking from the queue to review its gate, assign a unit, and complete the handoff workflow.</p>
          </div>
          <div id="bookingDetail" hidden></div>
        </section>
      </main>
    </div>
  </div>
  <div id="tabbarSlot"></div>
  <script type="module" src="/assets/js/ops-app.js"></script>
</body>
</html>
