<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talus Operations Console</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#18181b;color:#f4f4f5;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:1200px;margin:auto;padding:28px}h1{margin:0;font-size:25px}.sub{color:#a1a1aa;margin:8px 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card,.panel{background:#27272a;border:1px solid #3f3f46;border-radius:10px;padding:16px}.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#3f3f46;color:#d4d4d8;font-size:11px}.ready{background:#14532d;color:#bbf7d0}.in_use{background:#713f12;color:#fef08a}.maintenance{background:#7f1d1d;color:#fecaca}.meter{height:7px;background:#3f3f46;border-radius:4px;overflow:hidden;margin:11px 0}.meter i{display:block;height:100%;background:#22c55e}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{background:#e4e4e7;color:#18181b;border:0;border-radius:6px;padding:10px 12px;font:inherit;font-weight:bold;cursor:pointer}.actions button:hover{background:#fff}#log{height:260px;overflow:auto;background:#09090b;border:1px solid #3f3f46;border-radius:8px;padding:12px;white-space:pre-wrap;color:#a7f3d0}.warn{color:#fde68a}.pulse{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}</style>
<main><h1>TALUS / OPERATIONS CONSOLE</h1><p class="sub">Development console • authenticated demo session • assertions expire after 15 minutes</p><section id="fleet" class="grid"></section><section class="panel" style="margin-top:16px"><h3>ACTIVE OPERATION</h3><div class="actions"><button id="book">Quick Book & Assign</button><button id="waiver">Sign Liability Waiver</button><button id="hold">Authorize $1,000 Deposit Hold</button><button id="outbound">Perform & Seal Outbound Inspection</button><button id="dispatch">Dispatch Vehicle</button><button id="telemetry">Simulate Telemetry Ping</button><button id="inbound">Perform & Seal Inbound Inspection</button><button id="return">Return Vehicle</button><button id="settle">Settle Deposit & Finalize Ledger</button></div><p class="sub">Actions execute the database-enforced inspection, occupancy, and settlement workflows in sequence.</p></section><section class="panel" style="margin-top:16px"><h3>OPERATIONAL AUDIT LOG</h3><div id="log"></div></section></main>
<script>
let boot,active={};const log=document.querySelector('#log');const write=(label,value,ok=true)=>{log.textContent+=`[${new Date().toISOString()}] ${ok?'OK':'ERR'} ${label}\n${JSON.stringify(value)}\n\n`;log.scrollTop=log.scrollHeight};
const headers=(device=false)=>({'content-type':'application/json','authorization':'Bearer '+(device?boot.deviceToken:boot.staffToken),'x-tenant-id':boot.tenantId,'x-actor-kind':device?'device':'staff'});
async function api(method,url,body,device=false){const r=await fetch(url,{method,headers:headers(device),body:body?JSON.stringify(body):undefined});const data=await r.json().catch(()=>({}));write(method+' '+url,{status:r.status,...data},r.ok);if(!r.ok)throw Object.assign(new Error(data.code||data.error||'request failed'),{data});return data}
function render(){document.querySelector('#fleet').innerHTML=boot.fleet.map(m=>`<article class="card"><b>${m.fleet_number}</b><span class="tag ${m.status} ${m.status==='in_use'?'pulse':''}">${m.status.toUpperCase()}</span><p>${m.display_name}</p><small>Fuel ${m.fuel_pct??100}% • last ping ${m.last_seen_at||'not yet seen'}</small><div class="meter"><i style="width:${m.fuel_pct??100}%"></i></div></article>`).join('')}
document.querySelector('#book').onclick=async()=>{const now=new Date(Date.now()+86400000),end=new Date(+now+86400000);const b=await api('POST','/api/v1/bookings',{categoryLocationId:boot.categoryLocationId,rentalPeriod:{start:now.toISOString(),end:end.toISOString()},customerId:boot.customerId});active.item=b.booking_item_id;active.start=now.toISOString();active.end=end.toISOString();await api('POST','/api/v1/operations/assign',{bookingItemId:active.item,machineId:boot.machines[0].id})};
document.querySelector('#waiver').onclick=()=>api('POST',`/api/v1/bookings/${active.item}/waivers`,{customerId:boot.customerId,signerName:'Jane Doe',signatureRef:'ops-'+crypto.randomUUID(),signerIp:'127.0.0.1'}).catch(()=>{});
document.querySelector('#hold').onclick=async()=>{const r=await api('POST',`/api/v1/bookings/${active.item}/deposit-hold`,{amountCents:100000,paymentReference:'ops-'+crypto.randomUUID()});active.hold=r.transactionId;write('deposit held',{amountCents:100000,transactionId:active.hold})};
const checklist=[{item:'tires',passed:true},{item:'brakes',passed:true},{item:'body_panels',passed:true}];
document.querySelector('#outbound').onclick=async()=>{const r=await api('POST','/api/v1/inspections',{bookingItemId:active.item,machineId:boot.machines[0].id,type:'outbound',fuelLevelPct:100,odometerMiles:1240,notes:'Ops console outbound',checkItems:checklist});active.outbound=r.inspectionId};
document.querySelector('#dispatch').onclick=async()=>{const r=await api('POST','/api/v1/operations/dispatch',{bookingItemId:active.item,outboundInspectionId:active.outbound,dispatchedAt:active.start});active.trip=r.trip_id;boot.fleet[0].status='in_use';render()};
document.querySelector('#telemetry').onclick=async()=>{await api('POST','/api/v1/telemetry/ingest',{deviceId:boot.deviceId,machineId:boot.machines[0].id,recordedAt:new Date().toISOString(),latitude:37.0965,longitude:-113.5684,speedMph:12,engineHours:86,fuelLevelBp:9500,rawPayload:{source:'ops-console'}},true);boot.fleet[0].fuel_pct=95;boot.fleet[0].last_seen_at=new Date().toISOString();render()};
document.querySelector('#inbound').onclick=async()=>{const r=await api('POST','/api/v1/inspections',{bookingItemId:active.item,machineId:boot.machines[0].id,type:'inbound',fuelLevelPct:95,odometerMiles:1260,notes:'Ops console inbound',checkItems:checklist});active.inbound=r.inspectionId};
document.querySelector('#return').onclick=async()=>api('POST','/api/v1/operations/return',{bookingItemId:active.item,inboundInspectionId:active.inbound,returnedAt:active.end,fuelChargeCents:0,excessMileageCents:0});
document.querySelector('#settle').onclick=async()=>{await api('POST','/api/v1/operations/settle',{bookingItemId:active.item,holdJournalEntryId:active.hold,capturedCents:0,releasedCents:100000,excessReceivableCents:0});boot.fleet[0].status='ready';render()};
(async()=>{boot=await fetch('/ops/api/bootstrap').then(r=>r.json());write('bootstrap',{tenantId:boot.tenantId,assertionExpiresInSeconds:boot.assertionExpiresInSeconds});render()})().catch(e=>write('bootstrap failed',{message:e.message},false));
</script></html>
