<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Talus</title><style>body{font:16px system-ui;max-width:560px;margin:30px auto;padding:16px;background:#fafafa}input,select,button{width:100%;padding:12px;margin:8px 0}button{background:#111;color:#fff;border:0;border-radius:6px}.card{background:white;padding:20px;border-radius:10px;box-shadow:0 2px 12px #ddd}</style><div class=card><h1>Reserve your adventure</h1><select id=product></select><input id=start type=datetime-local><input id=end type=datetime-local><input id=customer value="33333333-3333-3333-3333-333333333333" hidden><button id=quote>Get Quote</button><pre id=out></pre><button id=book>Confirm Reservation</button></div><script>let products,choice;const out=document.querySelector('#out');fetch('/book/api/catalog').then(r=>r.json()).then(x=>{products=x.products;product.innerHTML=products.map(p=>`<option value="${p.category_location_id}">${p.display_name} — $${p.daily_rate_cents/100}/day</option>`).join('')});const period=()=>({start:new Date(start.value).toISOString(),end:new Date(end.value).toISOString()});quote.onclick=async()=>{choice=product.value;out.textContent=JSON.stringify(await fetch('/api/v1/quotes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({categoryLocationId:choice,rentalPeriod:period()})}).then(r=>r.json()),null,2)};book.onclick=async()=>{const r=await fetch('/book/api/reservations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({customerId:customer.value,categoryLocationId:product.value,rentalPeriod:period()})}).then(r=>r.json());location.href=r.waiverUrl}</script>
