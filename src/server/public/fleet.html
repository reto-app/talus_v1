<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talus Fleet Control Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css" />
  <script src="/assets/vendor/leaflet/leaflet.js"></script>
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/shell.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/fleet.css" />
</head>
<body>
  <a class="talus-skip-link" href="#main">Skip to main content</a>
  <div class="talus-shell">
    <div id="navSlot"></div>
    <div class="talus-content">
      <header class="talus-topbar">
        <h1 class="talus-condensed">LIVE FLEET</h1>
        <div class="talus-topbar-meta" id="topbarMeta">
          <span id="tenantLabel">Loading business…</span>
        </div>
        <div class="talus-topbar-spacer"></div>
        <time class="talus-clock" id="clock" aria-hidden="true">--:--</time>
        <button type="button" class="talus-icon-btn" id="logoutButton" aria-label="Sign out"></button>
      </header>

      <div id="connectionBanner" class="talus-banner" role="status" hidden></div>

      <div class="fleet-summary-strip" role="group" aria-label="Filter fleet by status" id="summaryStrip"></div>

      <main id="main" class="fleet-main">
        <section class="fleet-map-region is-active-tab" id="mapRegion" aria-label="Fleet map">
          <div class="fleet-map-toolbar">
            <div class="fleet-chip-group" role="group" aria-label="Show">
              <button type="button" class="fleet-chip" data-scope="all" aria-pressed="true">All</button>
              <button type="button" class="fleet-chip" data-scope="rented" aria-pressed="false">Rented</button>
              <button type="button" class="fleet-chip" data-scope="yard" aria-pressed="false">Yard</button>
              <button type="button" class="fleet-chip" data-scope="service" aria-pressed="false">Service</button>
            </div>
            <label class="fleet-search">
              <span class="talus-visually-hidden">Search fleet</span>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="search" id="fleetSearch" placeholder="Search fleet number…" />
            </label>
            <button type="button" class="talus-btn" id="toggleListView" aria-pressed="false">List view</button>
          </div>

          <div id="map" class="fleet-map" role="application" aria-label="Fleet map. A searchable list view is available as an alternative."></div>
          <div class="fleet-layer-control" role="group" aria-label="Map layer">
            <button type="button" id="roadLayerBtn" aria-pressed="true">Road</button>
            <button type="button" id="satelliteLayerBtn" aria-pressed="false">Satellite</button>
          </div>
          <div id="mapStatus" class="fleet-map-status"><p>Loading live fleet telemetry…</p></div>

          <div class="fleet-map-legend" aria-hidden="true">
            <strong class="talus-condensed" style="letter-spacing:.08em;font-size:11px">VEHICLE STATUS</strong>
            <div class="fleet-map-legend-row"><span class="talus-dot talus-dot-green"></span>On rent / ready</div>
            <div class="fleet-map-legend-row"><span class="talus-dot talus-dot-red"></span>Urgent incident</div>
            <div class="fleet-map-legend-row"><span class="talus-dot talus-dot-amber"></span>GPS stale</div>
            <div class="fleet-map-legend-row"><span class="talus-dot talus-dot-neutral"></span>Maintenance</div>
          </div>

          <div class="fleet-map-controls">
            <button type="button" id="fitFleetButton">Fit fleet</button>
            <button type="button" id="refreshButton">Refresh</button>
            <button type="button" id="autoRefreshButton" aria-pressed="true">Live: on</button>
          </div>

          <div id="listPanel" class="fleet-list-panel" hidden></div>

          <div id="detailDrawer" class="talus-drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1" hidden>
            <div class="talus-drawer-head">
              <div>
                <h2 class="talus-condensed" id="drawerTitle">Detail</h2>
                <p id="drawerSubtitle"></p>
              </div>
              <button type="button" class="talus-icon-btn" id="closeDrawerButton" aria-label="Close" style="margin-left:auto"></button>
            </div>
            <div class="talus-drawer-body" id="drawerBody"></div>
            <div class="talus-drawer-foot" id="drawerFoot" hidden></div>
          </div>
        </section>

        <aside class="fleet-incident-rail" id="incidentRail" aria-label="Open incidents">
          <div class="fleet-rail-head">
            <h2 class="talus-condensed">INCIDENTS</h2>
            <div class="fleet-rail-filters" role="group" aria-label="Incident filter">
              <button type="button" class="talus-btn talus-btn-sm" id="incidentFilterOpen" aria-pressed="true">Open</button>
              <button type="button" class="talus-btn talus-btn-sm" id="incidentFilterResolved" aria-pressed="false">Resolved</button>
            </div>
          </div>
          <div class="fleet-rail-list" id="incidentList"></div>
        </aside>
      </main>
    </div>
  </div>
  <div id="tabbarSlot"></div>
  <script type="module" src="/assets/js/fleet-app.js"></script>
</body>
</html>
