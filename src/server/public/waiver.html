<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Waiver</title><style>body{font:16px system-ui;max-width:620px;margin:20px auto;padding:16px}canvas{border:2px solid #222;width:100%;height:180px;touch-action:none}button{padding:12px;margin:8px}</style><h1>Digital Liability Waiver</h1><div id=context>Loading…</div><canvas id=pad width=580 height=180></canvas><button id=clear>Clear Signature</button><label><input id=agree type=checkbox> I agree to the terms and understand the risks.</label><button id=submit>Submit Signed Waiver</button><script>const item=location.pathname.split('/').pop(),token=new URLSearchParams(location.search).get('token'),ctx=pad.getContext('2d');let down=false;function point(e){let r=pad.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*pad.width/r.width,(p.clientY-r.top)*pad.height/r.height]}pad.onpointerdown=e=>{down=true;ctx.beginPath();ctx.moveTo(...point(e))};pad.onpointermove=e=>{if(down){ctx.lineTo(...point(e));ctx.stroke()}};pad.onpointerup=()=>down=false;clear.onclick=()=>ctx.clearRect(0,0,pad.width,pad.height);fetch(`/api/v1/bookings/${item}/waiver-context?token=${token}`).then(r=>r.json()).then(x=>context.innerHTML=`<h2>${x.customer_name}</h2><p>${x.vehicle_name}</p><p>${x.waiver_text}</p>`);submit.onclick=async()=>{if(!agree.checked)return alert('Please agree');let r=await fetch(`/waiver/${item}/api/submit`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,signerName:'Customer',signatureRef:pad.toDataURL()})});document.body.innerHTML=r.ok?'<h1>✓ Waiver Verified & Completed</h1>':'<h1>Unable to submit waiver</h1>'}</script>
